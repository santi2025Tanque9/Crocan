<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Crocan - {% block title %}{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        .navbar-custom {
            background: linear-gradient(135deg, #c62828 0%, #b71c1c 100%);
        }
        .navbar-brand, .nav-link, .navbar-text {
            color: white !important;
        }
        .nav-link:hover {
            color: #ffeb3b !important;
        }
        .btn-primary {
            background-color: #d32f2f;
            border-color: #d32f2f;
        }
        .btn-primary:hover {
            background-color: #b71c1c;
            border-color: #b71c1c;
        }
        .card-product {
            transition: transform 0.3s;
            height: 100%;
            border: 1px solid #e0e0e0;
        }
        .card-product:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(198, 40, 40, 0.15);
        }
        .category-sidebar {
            background-color: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
        }
        .customer-card {
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            color: white;
            border-radius: 15px;
        }
        .points-badge {
            background-color: #ff5252;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .badge-primary {
            background-color: #d32f2f;
        }
        .list-group-item.active {
            background-color: #d32f2f;
            border-color: #d32f2f;
        }
        .text-primary {
            color: #d32f2f !important;
        }
        .user-points {
            background-color: #ffc107;
            color: #000 !important;
            padding: 5px 12px;
            border-radius: 20px;
            margin-left: 10px;
            font-size: 0.9em;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .user-info {
            display: flex;
            align-items: center;
            color: white !important;
        }
        .user-name {
            color: white !important;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'products:product_list' %}">
                <i class="fas fa-shopping-bag me-2"></i>Club Crocan
            </a>
            
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <div class="d-flex align-items-center">
                        <div class="user-info me-3">
                            <span class="user-name">
                                <i class="fas fa-user me-1"></i>Hola, {{ user.nombre }}
                            </span>
                            {% if user.puntos %}
                                <span class="user-points">
                                    <i class="fas fa-star me-1"></i>{{ user.puntos }} pts
                                </span>
                            {% endif %}
                        </div>
                        <a class="nav-link" href="{% url 'users_app:logout' %}">
                            <i class="fas fa-sign-out-alt me-1"></i>Cerrar Sesión
                        </a>
                    </div>
                {% else %}
                    <a class="nav-link" href="{% url 'users_app:login' %}">
                        <i class="fas fa-sign-in-alt me-1"></i>Iniciar Sesión
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

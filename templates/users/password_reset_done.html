{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-body text-center p-4">
                    <h3 class="mb-3 text-success">📩 Revisa tu correo</h3>
                    <p class="mb-4">
                        Te hemos enviado un enlace a tu correo electrónico con las instrucciones para restablecer tu contraseña.
                        <br>
                        Si no lo encuentras, revisa la carpeta de <strong>spam</strong> o <strong>correo no deseado</strong>.
                    </p>
                    <a href="{% url 'users_app:login' %}" class="btn btn-primary w-100">
                        Volver al inicio de sesión
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar Sesión - Club Crocan{% endblock %}

{% block content %}


<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg border-0 rounded-3" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4">
            <h2 class="text-center mb-4">Iniciar Sesión</h2>
            
            <form method="post" novalidate>
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_username" class="form-label">Usuario</label>
                    {{ form.username }}
                </div>
                
                <div class="mb-3">
                    <label for="id_password" class="form-label">Contraseña</label>
                    {{ form.password }}
                </div>
                
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary">Ingresar</button>
                </div>
            </form>

            <div class="text-center">
                <p class="mb-1">
                    ¿No tienes cuenta? 
                    <a href="{% url 'users_app:registro' %}">Regístrate aquí</a>
                </p>
                <p>
                    <a href="{% url 'users_app:password_reset' %}">¿Olvidaste tu contraseña?</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

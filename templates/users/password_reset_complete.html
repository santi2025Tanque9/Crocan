{% extends "base.html" %}
{% block title %}Contraseña Restablecida - Club Crocan{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-body text-center p-4">
                    <h3 class="text-success mb-3">✅ Contraseña actualizada</h3>
                    <p class="mb-4">
                        Tu contraseña se restableció correctamente.  
                        Ahora podés iniciar sesión con tu nueva contraseña.
                    </p>
                    <a href="{% url 'users_app:login' %}" class="btn btn-primary w-100">
                        Ir al inicio de sesión
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
